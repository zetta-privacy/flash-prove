[package]
name = "flashprove"
version = "0.1.0"
edition = "2021"

[dependencies]
p3-goldilocks = "0.8"
p3-dft = "0.8"
p3-field = "0.8"

# hashing
sha2 = "0.10"
blake3 = "1.5"

# merkle
rs_merkle = "1.4"

# transcript
merlin = "3.0"

# inference
candle-core = "0.8"
candle-nn = "0.8"

# randomness
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# cli
clap = { version = "4", features = ["derive"] }

# parallelism
rayon = "1"

# hygiene
zeroize = "1"
subtle = "2"

# errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
