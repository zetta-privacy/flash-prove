[package]
name = "flashprove"
version = "0.1.0"
edition = "2021"

[dependencies]
# All Plonky3 crates pinned to the same 0.8.0 workspace rev (the published crates.io
# 0.8 release lacks TranscriptField for Goldilocks and the succinct-verifier
# crates gkr/sumcheck/multilinear-util/stir/whir, which live only in git).
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-sumcheck = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-multilinear-util = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }
p3-whir = { git = "https://github.com/Plonky3/Plonky3", rev = "0d80373" }

# randomness
rand = { version = "0.10", features = ["std_rng"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# cli
clap = { version = "4", features = ["derive"] }
metal = "0.33.0"

[profile.release]
opt-level = 3
lto = "thin"
